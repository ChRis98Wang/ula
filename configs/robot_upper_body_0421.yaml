  waist_roll_joint: 0.0
  right_arm_shoulder_pitch_joint: 0.0
  right_arm_shoulder_roll_joint: 0.0
  right_arm_shoulder_yaw_joint: 1.57
  right_arm_elbow_roll_joint: 0.1
  left_arm_shoulder_pitch_joint: 0.0
  left_arm_shoulder_roll_joint: 0.0
  left_arm_shoulder_yaw_joint: 1.57
  left_arm_elbow_roll_joint: 0.1
  head_yaw_joint: 0.0
