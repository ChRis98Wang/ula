  right_arm_shoulder_pitch_joint: [-1.57, 1.57]
  right_arm_shoulder_roll_joint: [-1.57, 2.00]
  right_arm_shoulder_yaw_joint: [0.0, 3.14]
  right_arm_elbow_roll_joint: [-0.4, 2.00]
  left_arm_shoulder_pitch_joint: [-1.57, 1.57]
